<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PS">
  <style>
    .mark {
      fill: #0e4c3e;
    }

    .letters {
      fill: #f6f8f6;
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      font-size: 25px;
      font-weight: 850;
      letter-spacing: -1px;
    }

    @media (prefers-color-scheme: dark) {
      .mark {
        fill: #9be8d4;
      }

      .letters {
        fill: #0b1110;
      }
    }
  </style>
  <rect class="mark" x="5" y="5" width="54" height="54" rx="14" />
  <text class="letters" x="32" y="40" text-anchor="middle">PS</text>
</svg>
